---
# honeypot：部署并管理 HFish SSH 蜜罐。
# 官方容器使用 host 网络和特权模式，以便动态创建低端口蜜罐。

- name: 校验 HFish 部署参数
  ansible.builtin.assert:
    that:
      - ansible_architecture in ['x86_64', 'amd64']
      - (honeypot.port | default(22) | int) >= 1
      - (honeypot.port | default(22) | int) <= 65535
      - (honeypot.management_port | default(4433) | int) >= 1
      - (honeypot.management_port | default(4433) | int) <= 65535
      - (honeypot.node_port | default(4434) | int) >= 1
      - (honeypot.node_port | default(4434) | int) <= 65535
      - (honeypot.management_port | default(4433) | int) == 4433
      - (honeypot.node_port | default(4434) | int) == 4434
      - (honeypot.management_port | default(4433) | int) != (honeypot.node_port | default(4434) | int)
      - (honeypot.management_port | default(4433) | int) != (honeypot.port | default(22) | int)
      - (honeypot.node_port | default(4434) | int) != (honeypot.port | default(22) | int)
      - (honeypot.management_port | default(4433) | int) != (effective_ssh_port | int)
      - (honeypot.node_port | default(4434) | int) != (effective_ssh_port | int)
    fail_msg: "HFish 官方 Docker 镜像仅支持 amd64；管理/节点端口须为官方默认 4433/4434，且不能与真实 SSH 冲突。"

- name: 检测 HFish SSH 首次初始化标记
  ansible.builtin.stat:
    path: "{{ honeypot.data_dir | default('/usr/share/hfish') }}/.autosafe-ssh-initialized"
  register: hfish_ssh_initialized

- name: 创建 HFish 持久化与编排目录
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ honeypot.data_dir | default('/usr/share/hfish') }}", mode: "0700" }
    - { path: "/opt/hfish", mode: "0755" }

- name: 写入 HFish Docker Compose 编排文件
  ansible.builtin.copy:
    dest: /opt/hfish/compose.yaml
    owner: root
    group: root
    mode: "0600"
    content: |
      services:
        hfish:
          image: {{ honeypot.image | default('threatbook/hfish-server:3.3.6') }}
          container_name: hfish
          network_mode: host
          privileged: true
          restart: unless-stopped
          environment:
            TZ: {{ honeypot.timezone | default('Asia/Shanghai') }}
          volumes:
            - {{ honeypot.data_dir | default('/usr/share/hfish') }}:/usr/share/hfish

- name: 部署 HFish（失败时自动清理未成功的容器）
  block:
    - name: 启动或更新 HFish
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - -f
          - /opt/hfish/compose.yaml
          - up
          - -d
          - --pull
          - missing
          - --remove-orphans
      register: hfish_compose_up
      changed_when: >-
        'Started' in (hfish_compose_up.stdout ~ hfish_compose_up.stderr)
        or 'Created' in (hfish_compose_up.stdout ~ hfish_compose_up.stderr)
        or 'Recreated' in (hfish_compose_up.stdout ~ hfish_compose_up.stderr)
        or 'Pulled' in (hfish_compose_up.stdout ~ hfish_compose_up.stderr)

    - name: 等待 HFish 管理页面就绪
      ansible.builtin.uri:
        url: "https://127.0.0.1:{{ honeypot.management_port | default(4433) }}/web/"
        method: GET
        validate_certs: false
        status_code: 200
      register: hfish_web_ready
      retries: 30
      delay: 2
      until: hfish_web_ready.status | default(0) == 200

    - name: 首次初始化前停止 HFish
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - -f
          - /opt/hfish/compose.yaml
          - stop
      changed_when: true
      when: not hfish_ssh_initialized.stat.exists

    - name: 备份 HFish 首次初始化数据库
      ansible.builtin.copy:
        src: "{{ honeypot.data_dir | default('/usr/share/hfish') }}/database/hfish.db"
        dest: "{{ honeypot.data_dir | default('/usr/share/hfish') }}/database/hfish.db.before-autosafe-ssh"
        remote_src: true
        owner: root
        group: root
        mode: "0600"
        force: false
      when: not hfish_ssh_initialized.stat.exists

    - name: 写入 HFish SSH 首次初始化脚本
      ansible.builtin.copy:
        dest: /opt/hfish/bootstrap-ssh.py
        owner: root
        group: root
        mode: "0700"
        content: |
          #!/usr/bin/env python3
          import json
          import sqlite3

          database = "{{ honeypot.data_dir | default('/usr/share/hfish') }}/database/hfish.db"
          service = {
              "type": "SSH",
              "name": "SSH蜜罐",
              "class": "网络服务",
              "port": "TCP/{{ honeypot.port | default(22) }}",
              "level": "low",
              "fish": 0,
              "https": "false",
              "command": "",
              "describe": "",
              "status": 1,
              "error": "",
              "is_web": False,
              "apikey": "",
              "proxy": "",
              "hostname": "",
              "username": "",
              "password": "",
              "files": "",
              "dns_books": "",
              "exe_ip": "",
              "exe_port": "",
              "firewall_status": 0,
          }

          connection = sqlite3.connect(database)
          try:
              row = connection.execute(
                  "SELECT client_id FROM clients WHERE client_name = ?",
                  ("内置节点",),
              ).fetchone()
              if row is None:
                  raise RuntimeError("HFish 内置节点不存在")
              connection.execute(
                  "UPDATE clients SET services = ?, mould_id = '', mould_status = '' "
                  "WHERE client_id = ?",
                  (json.dumps([service], ensure_ascii=False, separators=(",", ":")), row[0]),
              )
              connection.commit()
          finally:
              connection.close()
      when: not hfish_ssh_initialized.stat.exists

    - name: 将 HFish 内置节点收敛为单一 SSH 蜜罐
      ansible.builtin.command:
        argv:
          - python3
          - /opt/hfish/bootstrap-ssh.py
      changed_when: true
      when: not hfish_ssh_initialized.stat.exists

    - name: 首次初始化后启动 HFish
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - -f
          - /opt/hfish/compose.yaml
          - start
      changed_when: true
      when: not hfish_ssh_initialized.stat.exists

    - name: 首次初始化后再次等待 HFish 管理页面
      ansible.builtin.uri:
        url: "https://127.0.0.1:{{ honeypot.management_port | default(4433) }}/web/"
        method: GET
        validate_certs: false
        status_code: 200
      register: hfish_web_after_bootstrap
      retries: 30
      delay: 2
      until: hfish_web_after_bootstrap.status | default(0) == 200
      when: not hfish_ssh_initialized.stat.exists

    - name: 等待 HFish SSH 蜜罐端口就绪
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ honeypot.port | default(22) }}"
        state: started
        timeout: 60

    - name: 写入 HFish SSH 首次初始化标记
      ansible.builtin.file:
        path: "{{ honeypot.data_dir | default('/usr/share/hfish') }}/.autosafe-ssh-initialized"
        state: touch
        owner: root
        group: root
        mode: "0600"
        modification_time: preserve
        access_time: preserve
      when: not hfish_ssh_initialized.stat.exists

    - name: 清理 HFish SSH 首次初始化脚本
      ansible.builtin.file:
        path: /opt/hfish/bootstrap-ssh.py
        state: absent

  rescue:
    - name: 停止未成功启动的 HFish
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - -f
          - /opt/hfish/compose.yaml
          - down
      changed_when: true
      failed_when: false

    - name: 报告 HFish 部署失败
      ansible.builtin.fail:
        msg: "HFish 管理页面或 SSH 蜜罐端口未就绪，已清理未成功启动的 HFish 容器。"

- name: 放行 HFish 管理端口（未配置白名单时对公网开放）
  community.general.ufw:
    rule: allow
    port: "{{ honeypot.management_port | default(4433) }}"
    proto: tcp
    comment: "HFish management"
  when:
    - ufw.enabled | default(true)
    - honeypot.management_allowed_ips | default([]) | length == 0

- name: 按白名单放行 HFish 管理端口
  community.general.ufw:
    rule: allow
    port: "{{ honeypot.management_port | default(4433) }}"
    proto: tcp
    src: "{{ item }}"
    comment: "HFish management"
  loop: "{{ honeypot.management_allowed_ips | default([]) }}"
  when:
    - ufw.enabled | default(true)
    - honeypot.management_allowed_ips | default([]) | length > 0

- name: 启用管理 IP 白名单时删除管理端口的全网放行规则
  community.general.ufw:
    rule: allow
    port: "{{ honeypot.management_port | default(4433) }}"
    proto: tcp
    delete: true
  when:
    - ufw.enabled | default(true)
    - honeypot.management_allowed_ips | default([]) | length > 0

- name: 放行 HFish SSH 蜜罐端口
  community.general.ufw:
    rule: allow
    port: "{{ honeypot.port | default(22) }}"
    proto: tcp
    comment: "HFish SSH honeypot"
  when: ufw.enabled | default(true)

- name: 记录 HFish 到报告  # noqa: var-naming[no-role-prefix]
  ansible.builtin.set_fact:
    host_report: >-
      {{ host_report | combine({
        'actions': host_report.actions + [
          'HFish ' ~ ('已安装并初始化 SSH 蜜罐' if not hfish_ssh_initialized.stat.exists else '已存在，已检查/更新编排') ~
          '；SSH 蜜罐端口 ' ~ (honeypot.port | default(22)) ~
          '；数据目录 ' ~ (honeypot.data_dir | default('/usr/share/hfish'))
        ],
        'access_points': host_report.access_points + [{
          'name': 'HFish 蜜罐管理台',
          'address': 'https://' ~ ansible_host ~ ':' ~ (honeypot.management_port | default(4433)) ~ '/web/'
        }],
        'credentials': host_report.credentials + (
          [
            {'item': 'HFish 初始账号', 'value': 'admin'},
            {'item': 'HFish 初始密码', 'value': 'HFish2021'}
          ] if not hfish_ssh_initialized.stat.exists
          else [{'item': 'HFish 账号 / 密码', 'value': '已存在，请使用之前修改后的凭据'}]
        ),
        'warnings': host_report.warnings + [
          'HFish 初始账号密码为公开默认值；首次登录后必须立即修改密码',
          ('HFish 管理端口当前对公网开放；建议在 honeypot.management_allowed_ips 中配置管理 IP 白名单')
          if honeypot.management_allowed_ips | default([]) | length == 0
          else ('HFish 管理端口仅向配置的管理 IP 白名单放行')
        ]
      }) }}
