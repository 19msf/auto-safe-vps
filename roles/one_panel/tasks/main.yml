---
# one_panel：通过 1Panel 官方 v2 在线入口安装最新版本（幂等）
#
# 重要约定：
#   - 使用官方文档提供的 PANEL_NON_INTERACTIVE 环境变量模式。
#   - 未在 config.yml 指定 port / entrance / username / password 时，交给官方脚本
#     生成安全默认值；装完后用 `1pctl user-info` 读取真实值，再做：
#       1) 把真实端口加进 ufw 放行
#       2) 把账号 / 密码 / 完整访问地址写进报告
#       3) 给用户一条"请登录后自行修改账号密码端口"的警告
#   - 官方在线入口始终解析当前最新的 v2 稳定版本；已安装实例不会自动升级，
#     升级仍应在 1Panel 控制台中执行，避免无人值守升级影响现有业务。

- name: 检测 1Panel 是否已安装
  ansible.builtin.stat:
    path: /usr/local/bin/1pctl
  register: one_panel_pctl

- name: 生成 1Panel 官方非交互安装环境
  ansible.builtin.set_fact:
    one_panel_install_environment: >-
      {{ {
        'PANEL_NON_INTERACTIVE': 'true',
        'PANEL_LANG': one_panel.lang | default('zh'),
        'PANEL_INSTALL_DIR': one_panel.install_dir | default('/opt'),
        'PANEL_INSTALL_DOCKER': 'n',
        'PANEL_CONFIGURE_ACCELERATOR': 'n',
        'PANEL_REPLACE_DAEMON_JSON': 'n'
      }
      | combine({'PANEL_PORT': one_panel.port | string}
                if (one_panel.port | default('') | string | length > 0) else {})
      | combine({'PANEL_ENTRANCE': one_panel.entrance}
                if (one_panel.entrance | default('') | length > 0) else {})
      | combine({'PANEL_USERNAME': one_panel.username}
                if (one_panel.username | default('') | length > 0) else {})
      | combine({'PANEL_PASSWORD': one_panel.password}
                if (one_panel.password | default('') | length > 0) else {}) }}
  when: not one_panel_pctl.stat.exists
  no_log: true

- name: 下载 1Panel 官方最新 v2 安装入口
  ansible.builtin.get_url:
    url: "{{ one_panel.install_url | default('https://resource.fit2cloud.com/1panel/package/v2/quick_start.sh') }}"
    dest: /tmp/1panel-quick-start.sh
    owner: root
    group: root
    mode: "0700"
    validate_certs: true
  when: not one_panel_pctl.stat.exists

- name: 非交互安装最新 1Panel v2（仅首次）
  ansible.builtin.shell: |
    set -eo pipefail
    umask 077
    bash /tmp/1panel-quick-start.sh < /dev/null 2>&1 | tee /tmp/1panel-install.log
    exit ${PIPESTATUS[0]}
  args:
    executable: /bin/bash
    creates: /usr/local/bin/1pctl
  environment: "{{ one_panel_install_environment }}"
  when: not one_panel_pctl.stat.exists
  register: one_panel_install
  changed_when: one_panel_install.rc | default(0) == 0
  no_log: true

- name: 清理 1Panel 安装入口脚本
  ansible.builtin.file:
    path: /tmp/1panel-quick-start.sh
    state: absent
  when: not one_panel_pctl.stat.exists

- name: 等待 1panel-core 服务起来（最多 60 秒）
  ansible.builtin.shell: |
    set -e
    for i in $(seq 1 30); do
      if systemctl is-active --quiet 1panel-core 2>/dev/null; then exit 0; fi
      sleep 2
    done
    exit 1
  args:
    executable: /bin/bash
  changed_when: false

- name: 抓取 1Panel 真实运行信息（端口 / 入口 / 用户 / 密码）
  ansible.builtin.command: 1pctl user-info
  register: one_panel_userinfo
  changed_when: false
  no_log: true

- name: 解析 1pctl user-info 输出
  ansible.builtin.set_fact:
    one_panel_real_port: "{{ one_panel_userinfo.stdout
      | regex_search('https?://[^:\\s]+:(\\d+)/', '\\1')
      | first | default('') }}"
    one_panel_real_entrance: "{{ one_panel_userinfo.stdout
      | regex_search('https?://[^:\\s]+:\\d+/(\\S+)', '\\1')
      | first | default('') }}"
    one_panel_real_user: "{{ one_panel_userinfo.stdout
      | regex_search('(?im)^(?:Panel user|User|面板用户|用户名)[：:]\\s*(\\S+)', '\\1')
      | first | default('') }}"
    one_panel_real_password: "{{ one_panel_userinfo.stdout
      | regex_search('(?im)^(?:Panel password|User password|面板密码|密码)[：:]\\s*(\\S+)', '\\1')
      | first | default('') }}"
  no_log: true

- name: 校验解析结果
  ansible.builtin.assert:
    that:
      - one_panel_real_port | length > 0
      - (one_panel_real_port | regex_search('^[0-9]+$')) is not none
      - one_panel_real_entrance | length > 0
      - one_panel_real_user | length > 0
      - one_panel_real_password | length > 0
    fail_msg: "未能从 `1pctl user-info` 完整解析 1Panel 访问信息，请上 VPS 手动运行 `sudo 1pctl user-info` 检查输出格式。"
  no_log: true

- name: UFW 放行 1Panel 实际端口
  community.general.ufw:
    rule: allow
    port: "{{ one_panel_real_port }}"
    proto: tcp
    comment: "1Panel"
  when: ufw.enabled | default(true)

- name: 记录到报告（密码是 1Panel 随机生成的，原样回传，方便用户登录后自行修改） # noqa: var-naming[no-role-prefix]
  ansible.builtin.set_fact:
    host_report: >-
      {{ host_report | combine({
        'actions': host_report.actions + [
          ('1Panel 已存在，未重新安装') if one_panel_pctl.stat.exists
          else ('已通过官方 v2 在线入口安装最新 1Panel')
        ],
        'access_points': host_report.access_points + [{
          'name': '1Panel 面板',
          'address': 'http://' ~ ansible_host ~ ':' ~ one_panel_real_port ~ '/' ~ one_panel_real_entrance
        }],
        'credentials': host_report.credentials + [
          {'item': '1Panel 账号', 'value': one_panel_real_user},
          {'item': '1Panel 密码', 'value': one_panel_real_password},
          {'item': '1Panel 端口', 'value': one_panel_real_port},
          {'item': '1Panel 入口', 'value': one_panel_real_entrance}
        ],
        'warnings': host_report.warnings + (
          ['1Panel 已通过官方非交互模式安装。请登录控制台后启用 MFA；账号、密码或端口也可用 `sudo 1pctl update {username|password|port}` 调整']
          if (not one_panel_pctl.stat.exists) else []
        )
      }) }}
